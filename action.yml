name: "repo-pet"
# Under 125 characters: that is what the Marketplace form accepts. A test
# enforces it, because the form rejects it only at the very last step.
description: >-
  Renders a repo or your GitHub activity as an animated pixel pet, committed
  daily as an SVG.

branding:
  icon: "heart"
  color: "green"

# Careful with the descriptions below: GitHub evaluates `${{ ... }}` inside
# `description` too, and there is no `github` context available there. An
# example written that way stops the entire file from loading
# ("Unrecognized named-value: 'github'") - the action is dead, not merely
# mis-documented. Examples therefore stay prose; the full syntax lives in
# the README. A test enforces this.
inputs:
  github_token:
    description: >-
      Token for the GitHub API. Reads commits, issues and workflow runs, and
      writes the SVG to the output branch. The job needs
      `permissions: contents: write` - the most common setup problem. In a
      workflow this is usually the `github.token` expression.
    required: true
  output_branch:
    description: >-
      Branch the SVG is written to. Deliberately not your default branch: the
      file changes daily and would bury the history of your actual code. If
      the branch does not exist, it is created as an orphan containing
      nothing but this one file.
    required: false
    default: "pet-output"
  output_filename:
    description: "Path inside the output branch. Subdirectories are allowed."
    required: false
    default: "pet.svg"
  repository:
    description: >-
      The repository to measure, as `owner/repo`. The commit always goes to
      the repository the workflow runs in, so this lets you watch someone
      else's repository while the image lands in your own.
    required: false
    default: ${{ github.repository }}
  user:
    description: >-
      Measure a person instead of a repository: their commit activity and the
      state of their repositories, the way a GitHub profile shows it. Takes
      precedence over `repository` when set. Note that a workflow's
      `github.token` only sees public activity - counting private
      contributions needs a personal access token with `read:user` scope and
      the "Include private contributions on my profile" setting.
    required: false
    default: ""
  dry_run:
    description: >-
      Collect and render, but write nothing. For a first run and for checking
      permissions without producing a commit.
    required: false
    default: "false"

outputs:
  mood:
    description: "Mood of the pet: happy, content, sad or sick."
  satiety:
    description: "Satiety 0-100, derived from commit activity."
  health:
    description: "Health 0-100, derived from CI status and issue hygiene."
  svg_url:
    description: >-
      raw.githubusercontent.com URL of the committed file, ready to embed.
      Empty on `dry_run`, because there is nothing for it to point at.

runs:
  # Node 20 was removed from the runners on 2026-09-23, along with the
  # ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION opt-out. node24 is currently the
  # only sensible choice - the metadata reference still lists node20, but it
  # is out of date on that point. Do not revert.
  using: "node24"
  main: "dist/index.cjs"
