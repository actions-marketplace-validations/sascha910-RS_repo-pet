name: "repo-pet"
description: >-
  Turns a repository's commit activity, CI status and issue hygiene into an
  animated pixel pet, committed as an SVG to a branch of its own.

branding:
  icon: "heart"
  color: "green"

# Die Werte hier sind englisch, weil sie nach aussen gehen: `description`
# ganz oben ist der Text des Marketplace-Eintrags, und die Input-Texte
# erscheinen in der Autovervollstaendigung, wenn jemand `with:` tippt. Die
# Kommentare bleiben deutsch - die gehoeren dem, der die Datei wartet.
#
# Achtung bei den Beschreibungen unten: GitHub wertet `${{ ... }}` auch in
# `description` aus, und dort gibt es keinen `github`-Kontext. Ein Beispiel
# in dieser Schreibweise laesst die ganze Datei nicht mehr laden
# ("Unrecognized named-value: 'github'") - die Action ist dann tot, nicht
# nur die Beschreibung falsch. Beispiele bleiben deshalb Prosa; die volle
# Schreibweise steht im README.
inputs:
  github_token:
    description: >-
      Token for the GitHub API. Reads commits, issues and workflow runs, and
      writes the SVG to the output branch. The job needs
      `permissions: contents: write` - the most common setup problem. In a
      workflow this is usually the `github.token` expression.
    required: true
  output_branch:
    description: >-
      Branch the SVG is written to. Deliberately not your default branch: the
      file changes daily and would bury the history of your actual code. If
      the branch does not exist, it is created as an orphan containing
      nothing but this one file.
    required: false
    default: "pet-output"
  output_filename:
    description: "Path inside the output branch. Subdirectories are allowed."
    required: false
    default: "pet.svg"
  repository:
    description: >-
      The repository to measure, as `owner/repo`. The commit always goes to
      the repository the workflow runs in, so this lets you watch someone
      else's repository while the image lands in your own.
    required: false
    default: ${{ github.repository }}
  dry_run:
    description: >-
      Collect and render, but write nothing. For a first run and for checking
      permissions without producing a commit.
    required: false
    default: "false"

outputs:
  mood:
    description: "Mood of the pet: happy, content, sad or sick."
  satiety:
    description: "Satiety 0-100, derived from commit activity."
  health:
    description: "Health 0-100, derived from CI status and issue hygiene."
  svg_url:
    description: >-
      raw.githubusercontent.com URL of the committed file, ready to embed.
      Empty on `dry_run`, because there is nothing for it to point at.

runs:
  # Node 20 wurde am 23.09.2026 aus den Runnern entfernt, inklusive des
  # Opt-outs ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION. node24 ist die aktuell
  # einzige sinnvolle Wahl - die Metadata-Referenz listet node20 zwar noch,
  # ist an der Stelle aber veraltet.
  using: "node24"
  main: "dist/index.cjs"
