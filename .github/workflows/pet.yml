name: repo-pet

on:
  schedule:
    # Not on the hour: GitHub spreads scheduled runs out, and the round
    # times are congested. An odd minute is noticeably more punctual.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, commit nothing"
        type: boolean
        default: false

# Without this the commit fails with "Resource not accessible by
# integration" - the most common setup problem.
permissions:
  contents: write

# Two concurrent runs would both commit onto the same branch tip; the second
# would then fail at updateRef, which deliberately runs without force.
concurrency:
  group: repo-pet
  cancel-in-progress: false

jobs:
  pet:
    runs-on: ubuntu-latest
    steps:
      # Needed because `uses: ./` loads the action from the working
      # directory. The output branch is not checked out - it is written
      # through the Git data API.
      - uses: actions/checkout@v7

      - id: pet
        uses: ./
        with:
          github_token: ${{ github.token }}
          # Measure the person, not this single repository: commits across
          # all projects and the CI cross-section over them. Without this
          # line it would be repo-pet itself again.
          user: sascha910-RS
          # `inputs` is empty on a scheduled run, so this is false.
          dry_run: ${{ inputs.dry_run || false }}

      - name: Report the state
        run: |
          echo "Mood    : ${{ steps.pet.outputs.mood }}"
          echo "Satiety : ${{ steps.pet.outputs.satiety }}"
          echo "Health  : ${{ steps.pet.outputs.health }}"
          echo "SVG     : ${{ steps.pet.outputs.svg_url }}"
