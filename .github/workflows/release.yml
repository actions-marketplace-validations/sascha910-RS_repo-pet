name: Release

on:
  push:
    tags: ["v*.*.*"]

# For `gh release create` and for moving the major tag.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # The most important step. A release with a stale dist/ would be worse
      # than no release at all: for a JavaScript action GitHub runs exactly
      # that file, and nothing about it reveals that it does not match the
      # tag.
      - name: Check dist/ and gallery against the source
        run: npm run build:check

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      # The moving major tag deliberately carries no release.
      #
      # With immutable releases enabled for a repository, a tag that has a
      # release attached is pinned forever - and its name cannot even be
      # reused afterwards. A `v1` that is meant to move therefore has to stay
      # a plain Git tag. Only then does the move below work in both worlds.
      - name: Move the major tag
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"

          # Pre-releases (v1.2.0-rc.1) do not move the major tag - otherwise
          # everyone pointing at `v1` would get a release candidate they
          # never asked for.
          if [[ "$version" == *-* ]]; then
            echo "$version is a pre-release, leaving the major tag alone."
            exit 0
          fi

          major="${version%%.*}"
          echo "Pointing $major at $GITHUB_SHA"
          # Lightweight tag: needs no Git identity.
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
