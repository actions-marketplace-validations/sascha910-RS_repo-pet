name: Release

on:
  push:
    tags: ["v*.*.*"]

# Fuer `gh release create` und fuer das Verschieben des Major-Tags.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Der wichtigste Schritt. Ein Release mit veraltetem dist/ waere
      # schlimmer als kein Release: GitHub fuehrt bei einer
      # JavaScript-Action genau diese Datei aus, und niemand sieht ihr an,
      # dass sie nicht zum Tag passt.
      - name: dist/ und Galerie gegen den Quelltext pruefen
        run: npm run build:check

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      # Der bewegliche Major-Tag bekommt bewusst *kein* Release.
      #
      # Sind fuer das Repo Immutable Releases aktiviert, ist ein Tag, an dem
      # ein Release haengt, fuer immer festgenagelt – und sein Name danach
      # nicht einmal mehr wiederverwendbar. Ein `v1`, das mitwandern soll,
      # muss deshalb ein blanker Git-Tag ohne Release bleiben. Nur dann
      # funktioniert das Verschieben unten in beiden Welten.
      - name: Beweglichen Major-Tag setzen
        run: |
          set -euo pipefail
          version="$GITHUB_REF_NAME"

          # Vorabversionen (v1.2.0-rc.1) bewegen den Major-Tag nicht - sonst
          # bekaemen alle, die auf `v1` zeigen, ungefragt einen Release
          # Candidate.
          if [[ "$version" == *-* ]]; then
            echo "$version ist eine Vorabversion, $GITHUB_REF_NAME bleibt allein stehen."
            exit 0
          fi

          major="${version%%.*}"
          echo "Setze $major auf $GITHUB_SHA"
          # Leichtgewichtiger Tag: braucht keine Git-Identitaet.
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
