name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The same version action.yml declares as its runtime.
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # dist/ and the gallery are committed and have to match the source,
      # otherwise other repositories run a different version than the one
      # visible here.
      - run: npm run build:check
